<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClockIt — Focus, Tasks, Notes &amp; Habits Dashboard</title>
  <meta name="description" content="ClockIt is a unified workspace for focus timer, task prioritization, notes knowledge graph, habits tracker, and calendar.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Google Fonts: Newsreader (Serif), Instrument Serif, Inter, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;450;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;450;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;450;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- Theme initialization script (prevents flash of incorrect theme) -->
  <script>
    try {
      var appPref = localStorage.getItem('clockit-appearance');
      var isDark = false;
      if (appPref === 'dark') {
        isDark = true;
      } else if (appPref === 'system' || !appPref) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          isDark = true;
        } else if (localStorage.getItem('tracker-theme') === 'dark') {
          isDark = true;
        }
      } else if (localStorage.getItem('tracker-theme') === 'dark') {
        isDark = true;
      }
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="clockit-app-active">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
